name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint / typecheck / tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The packaging tests validate the real release artifact, and that artifact
      # is gitignored, so it has to be produced before `npm run test`. Without
      # this step those tests fail on a clean checkout while passing locally,
      # which is the worst possible failure mode for a release gate.
      - run: npm run package:release
      - run: npm run test
      - run: npm run build

  e2e:
    name: Extension E2E (Chromium, headed under xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run MV3 extension E2E
        run: xvfb-run -a npm run test:e2e

name: Feature request
description: Suggest a capability or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape CueParcel.

        The most useful feature requests describe **the problem**, not the
        solution. CueParcel has hard boundaries on purpose: it is local-first, it
        never calls a model, and it ships with exactly four permissions. Requests
        that need a backend, telemetry, an API key or broader permissions will be
        declined regardless of how useful they would otherwise be — see the
        [roadmap](https://github.com/kallist/CueParcel/blob/main/ROADMAP.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you are in and why the current product does not handle it.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What do you do today instead?
      description: Including "I copy/paste by hand" or "I use another tool" is a perfectly good answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like CueParcel to do?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of the product does this concern?
      options:
        - Capture and extraction
        - Semantic adapters (page-type detection)
        - Context Lens
        - Context Cart
        - Context Recipes
        - TaskSpec
        - Context Receipt
        - Output formats (Agent / Markdown / JSON)
        - Side Panel UI and accessibility
        - Distribution and installation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Does this fit CueParcel's boundaries?
      description: |
        Say briefly how this stays local-first, needs no new permissions, and does
        not require calling a model or a server. If it cannot, say so — an honest
        "this would need X" is more useful than a request that quietly breaks the
        model.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap, and this is not already covered.
          required: true
        - label: I have not included private page content or credentials in this request.
          required: true

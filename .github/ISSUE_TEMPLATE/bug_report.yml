name: Bug report
description: Something in CueParcel does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Before you paste anything:** please do not include private page content,
        URLs from private systems, cookies, tokens, session data, or screenshots
        that show confidential information. A description of the shape of the data
        is enough. See [SECURITY.md](https://github.com/kallist/CueParcel/blob/main/SECURITY.md).

  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: For example "Chrome 151.0.7922.34" or "Edge 151". Find it at `chrome://version`.
      placeholder: Chrome 151.0.7922.34
    validations:
      required: true

  - type: input
    id: cueparcel-version
    attributes:
      label: CueParcel version
      description: Shown on the extension's card at `chrome://extensions`, and in the Side Panel header area.
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install CueParcel?
      options:
        - Unpacked from a GitHub release ZIP
        - Built from source (`npm run build`, loaded `dist/`)
        - Other (explain below)
    validations:
      required: true

  - type: dropdown
    id: url-type
    attributes:
      label: What kind of page were you on?
      description: Pick the closest match. If you cannot say without revealing a private URL, describe the page type instead.
      options:
        - GitHub issue
        - GitHub pull request
        - Technical documentation site
        - Blog post or article
        - App-like or heavily script-rendered page
        - Page with content inside an iframe or shadow root
        - PDF or other non-HTML document
        - Local file or `file://` page
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: context-lens
    attributes:
      label: Were you using the Context Lens when it happened?
      options:
        - "No — this happened during or before capture"
        - "Yes — the Context Lens was active"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the product?
      options:
        - Capture (clicking the toolbar icon or Alt+Shift+Y)
        - Context Lens (picking areas on the page)
        - Context Cart (adding, roles, reorder, clear)
        - Recipe selection
        - Agent / Markdown / TaskSpec output
        - Context Receipt
        - Copy or download
        - Side Panel UI
        - Toolbar icon, badge or pin onboarding
        - Build, install or tooling
        - Not sure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: If the extension showed an error code (for example `NO_CONTENT_FOUND`), quote it exactly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh browser window if possible.
      placeholder: |
        1. Open ...
        2. Click the CueParcel icon
        3. ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a short recording
      description: |
        Drag images in here if they help. Redact anything private first — the Side
        Panel shows the page you captured, and the receipt lists what was included.
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console output (optional)
      description: |
        If you can, open the Side Panel's DevTools (right-click inside the panel →
        Inspect) and the Service Worker's console (`chrome://extensions` →
        CueParcel → "service worker") and paste any errors. Redact private data.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I have not included private page content, credentials or tokens in this report.
          required: true
        - label: This is a bug report, not a security vulnerability. (Security issues go through the private advisory form linked above.)
          required: true
